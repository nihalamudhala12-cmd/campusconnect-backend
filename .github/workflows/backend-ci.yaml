name: CampusConnect Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      # 1. Create database schema / tables first
      - run: npm run schema:setup # Replace with your schema script (e.g., node src/db/schema.js)
        env:
          DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/testdb

      # 2. Seed database immediately after schema setup
      - run: npm run db:seed # Replace with your seed script (e.g., node src/db/seed.js)
        env:
          DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/testdb

      # 3. Execute test suite
      - run: npm test
        env:
          DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/testdb